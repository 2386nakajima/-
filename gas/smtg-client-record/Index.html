<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--ink:#172623;--muted:#7b8985;--green:#173f35;--green2:#28584b;--line:#e3e9e5;--paper:#f5f6f3;--coral:#d58f70;--soft:#eef4f0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--green);padding:28px 18px;color:#fff;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:800;padding:0 8px 30px}.brand i{width:34px;height:34px;border:1px solid #82a097;border-radius:11px 3px;display:grid;place-items:center;font:22px Georgia}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#abc3bb;text-align:left;padding:12px;border-radius:9px}.nav button.active{color:#fff;background:var(--green2);box-shadow:inset 3px 0 var(--coral)}.account{margin-top:auto;border-top:1px solid #356156;padding:18px 8px 0}.account strong,.account small{display:block;overflow:hidden;text-overflow:ellipsis}.account strong{font-size:11px}.account small{margin-top:4px;color:#94b2a8;font-size:9px}.main{margin-left:230px;width:calc(100% - 230px)}.top{height:76px;padding:0 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.search{flex:1;max-width:520px;border:0;outline:0;font-size:13px}.btn{border:1px solid var(--line);background:#fff;color:#53645f;padding:10px 14px;border-radius:9px;font-size:11px;font-weight:700}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn:disabled{opacity:.5}.canvas{max-width:1420px;margin:auto;padding:30px}.welcome{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:#a16e58;font-size:9px;font-weight:800;letter-spacing:.16em}.welcome h1{margin:0;font-size:27px;letter-spacing:-.04em}.welcome p:last-child{margin:7px 0 0;color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat small{color:var(--muted);font-size:9px}.stat strong{display:block;margin-top:8px;font:26px Georgia}.unit-strip{display:flex;gap:8px;overflow:auto;padding:2px 0 18px}.chip{border:1px solid #dbe4df;background:#fff;color:#557068;padding:8px 11px;border-radius:99px;font-size:10px;white-space:nowrap}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:610px}.list{padding:22px;background:#fafbf9;border-right:1px solid var(--line)}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.list-head h2{margin:0;font-size:17px}.cards{display:grid;gap:8px}.company{width:100%;padding:13px;border:1px solid transparent;background:transparent;border-radius:11px;text-align:left;display:flex;gap:11px;align-items:center}.company:hover,.company.active{background:#fff;border-color:#dce4e0;box-shadow:0 5px 18px #173f350e}.logo{width:42px;height:42px;border-radius:11px;background:#dcebe4;color:#3c6c5b;display:grid;place-items:center;font-size:11px;font-weight:900}.company>div{min-width:0;flex:1}.company strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.company small{display:block;margin-top:5px;color:var(--muted);font-size:9px}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#e4f0e9;color:#39705b;font-size:8px;margin:5px 4px 0 0}.badge.wait{background:#f7eadf;color:#9a633f}.detail{padding:30px 36px}.hero{display:flex;justify-content:space-between;gap:20px;padding-bottom:22px;border-bottom:1px solid var(--line)}.hero-main{display:flex;gap:14px;align-items:center}.hero .logo{width:52px;height:52px}.hero h2{margin:0;font-size:22px}.hero p{margin:6px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px;align-items:flex-start}.section{margin-top:26px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-title h3{margin:0;font-size:14px}.section-title button{border:0;background:transparent;color:#6b7b76;font-size:10px}.next{border:1px solid #dfe7e2;border-left:4px solid var(--coral);border-radius:11px;overflow:hidden}.task{display:flex;gap:12px;align-items:center;padding:14px}.task+.task{border-top:1px solid var(--line)}.check{width:20px;height:20px;border:1px solid #b9c7c2;border-radius:50%;background:#fff}.task.done{opacity:.55}.task.done strong{text-decoration:line-through}.task>div{flex:1}.task strong{font-size:11px}.task p{margin:4px 0 0;color:var(--muted);font-size:9px}.meeting{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.date{width:48px;height:49px;background:#f2eee9;border-radius:9px;display:grid;place-items:center;font:19px Georgia}.meeting strong{font-size:11px}.meeting p{margin:5px 0 0;color:var(--muted);font-size:9px;line-height:1.6}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.video{border:1px solid var(--line);border-radius:10px;overflow:hidden}.video iframe{width:100%;aspect-ratio:16/9;border:0;background:#223a33}.video strong{display:block;padding:10px;font-size:10px}.empty{padding:28px;border:1px dashed #d8e1dc;border-radius:10px;text-align:center;color:#82908c;font-size:10px}.detail-empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted)}.detail-empty h2{color:var(--ink)}.modal-bg{position:fixed;inset:0;background:#112c2568;display:grid;place-items:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:25px;box-shadow:0 24px 70px #10271f44}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0;font-size:20px}.close{border:0;background:#eef1ef;width:30px;height:30px;border-radius:50%}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:20px}.field{display:grid;gap:7px;color:#52635e;font-size:10px;font-weight:700}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid #dce4df;border-radius:8px;padding:10px;outline:0}.field textarea{min-height:80px;resize:vertical}.hint{color:#8a9692;font-size:9px;line-height:1.6}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:24px;bottom:24px;background:var(--green);color:#fff;padding:12px 17px;border-radius:9px;font-size:11px;z-index:30}.loading{position:fixed;inset:0;background:#f5f6f3;display:grid;place-items:center;z-index:50}.spinner{width:38px;height:38px;border:3px solid #d9e3de;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.side{width:74px}.brand span,.nav button{font-size:0}.brand{padding-inline:0;justify-content:center}.nav button{text-align:center}.nav button:first-letter{font-size:17px}.account{display:none}.main{margin-left:74px;width:calc(100% - 74px)}.layout{grid-template-columns:300px 1fr}.detail{padding:25px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.main{margin:0;width:100%}.top{padding:0 14px}.top .btn:not(.primary){display:none}.canvas{padding:20px 13px}.welcome{align-items:flex-start}.stats{gap:8px}.layout{display:block}.list{border:0}.detail{border-top:1px solid var(--line)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.video-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="loading" class="loading"><div><div class="spinner"></div><p>顧客カルテを準備しています</p></div></div>
  <div class="shell">
    <aside class="side"><div class="brand"><i>C</i><span>Client Note</span></div><div class="nav"><button class="active">◆ 顧客カルテ</button><button onclick="syncNow()">↻ SMTG同期</button><button onclick="openCompany()">＋ 企業を追加</button></div><div class="account"><strong id="userEmail">Googleアカウント</strong><small>個人用データベース</small></div></aside>
    <main class="main">
      <header class="top"><input id="search" class="search" placeholder="会社名・担当者・支援ユニットを検索" oninput="render()"><button class="btn" onclick="syncNow()">↻ カレンダー同期</button><button class="btn primary" onclick="openCompany()">＋ 新規企業</button></header>
      <div class="canvas"><div class="welcome"><div><p class="eyebrow">CUSTOMER SUCCESS WORKSPACE</p><h1>顧客カルテ</h1><p id="syncLabel">Googleカレンダーから【SMTG】予定を取り込みます</p></div><a id="dbLink" class="btn" target="_blank">保存データを開く</a></div><div id="stats" class="stats"></div><div id="unitStrip" class="unit-strip"></div><div class="layout"><section class="list"><div class="list-head"><h2>企業一覧</h2><span id="companyCount"></span></div><div id="companyCards" class="cards"></div></section><section id="detail" class="detail"></section></div></div>
    </main>
  </div>
  <div id="modalRoot"></div><div id="toastRoot"></div>
  <script>
    let state={companies:[],units:[],meetings:[],tasks:[],videos:[],settings:{}},selected='',unitFilter='';
    const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function run(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error.message||error)))[name](...args))}
    run('getBootstrap').then(result=>{state=result.data;$('userEmail').textContent=result.user.email;$('dbLink').href=result.user.databaseUrl;if(state.companies[0])selected=state.companies[0].id;$('loading').remove();render()}).catch(showError);
    function render(){const query=$('search').value.toLowerCase();const filtered=state.companies.filter(c=>{const unitText=(c.supportUnits||[]).map(u=>u.name).join(' ');return(!unitFilter||(c.supportUnits||[]).some(u=>u.id===unitFilter))&&(c.name+' '+c.contact+' '+unitText).toLowerCase().includes(query)});$('companyCount').textContent=filtered.length+'社';$('syncLabel').textContent=state.settings.lastSyncedAt?'最終同期：'+formatDateTime(state.settings.lastSyncedAt):'Googleカレンダーから【SMTG】予定を取り込みます';$('stats').innerHTML=stat('登録企業',state.companies.length,'社')+stat('支援ユニット',state.units.length,'件')+stat('未完了タスク',state.tasks.filter(t=>t.completed!=='true').length,'件')+stat('SMTG履歴',state.meetings.length,'件');$('unitStrip').innerHTML=`<button class="chip ${!unitFilter?'active':''}" onclick="filterUnit('')">すべて</button>`+state.units.map(u=>`<button class="chip ${unitFilter===u.id?'active':''}" onclick="filterUnit('${u.id}')">${esc(u.name)} ${state.companies.filter(c=>(c.supportUnits||[]).some(x=>x.id===u.id)).length}</button>`).join('');$('companyCards').innerHTML=filtered.length?filtered.map(companyCard).join(''):'<div class="empty">該当する企業はありません</div>';renderDetail()}
    function stat(label,value,suffix){return `<div class="stat"><small>${label}</small><strong>${value}<small>${suffix}</small></strong></div>`}
    function companyCard(c){const units=(c.supportUnits||[]).slice(0,2).map(u=>`<span class="badge">${esc(u.name)}</span>`).join('');return `<button class="company ${selected===c.id?'active':''}" onclick="selectCompany('${c.id}')"><span class="logo">${esc(initials(c.name))}</span><div><strong>${esc(c.name)}</strong><small>${esc(c.contact||'担当者未設定')} ・ ${state.meetings.filter(m=>m.companyId===c.id).length}件</small>${units}${c.status==='確認待ち'?'<span class="badge wait">確認待ち</span>':''}</div></button>`}
    function selectCompany(id){selected=id;render()}function filterUnit(id){unitFilter=id;render()}function initials(name){return name.replace(/株式会社|有限会社|合同会社/g,'').trim().slice(0,2).toUpperCase()||'--'}
    function renderDetail(){const c=state.companies.find(x=>x.id===selected);if(!c){$('detail').innerHTML='<div class="detail-empty"><div><p class="eyebrow">GET STARTED</p><h2>企業を登録してください</h2><p>手入力またはカレンダー同期からカルテを作成できます。</p><button class="btn primary" onclick="openCompany()">＋ 新規企業</button></div></div>';return}const meetings=state.meetings.filter(m=>m.companyId===c.id).sort((a,b)=>b.startAt.localeCompare(a.startAt)),tasks=state.tasks.filter(t=>t.companyId===c.id),videos=state.videos.filter(v=>v.companyId===c.id);$('detail').innerHTML=`<div class="hero"><div class="hero-main"><span class="logo">${esc(initials(c.name))}</span><div><h2>${esc(c.name)}</h2><p>${esc(c.industry||'業種未設定')} ・ 担当：${esc(c.contact||'未設定')}</p><div>${(c.supportUnits||[]).map(u=>`<span class="badge">${esc(u.groupName?u.groupName+' / '+u.name:u.name)}</span>`).join('')}</div></div></div><div class="actions"><button class="btn" onclick="openMerge()">統合</button><button class="btn" onclick="openCompany('${c.id}')">編集</button></div></div>${section('NEXT ACTION','次回やること',`<button onclick="openTask()">＋ 追加</button>`,tasks.length?`<div class="next">${tasks.map(taskHtml).join('')}</div>`:'<div class="empty">次回やることは未登録です</div>')}${section('MEETINGS','SMTG履歴','',meetings.length?meetings.slice(0,8).map(meetingHtml).join(''):'<div class="empty">カレンダー同期後に履歴が表示されます</div>')}${section('VIDEOS','関連動画',`<button onclick="openVideo()">＋ URL追加</button>`,videos.length?`<div class="video-grid">${videos.map(videoHtml).join('')}</div>`:'<div class="empty">説明欄の動画URLは同期時に自動登録されます</div>')}`}
    function section(label,title,action,content){return `<div class="section"><div class="section-title"><div><p class="eyebrow">${label}</p><h3>${title}</h3></div>${action}</div>${content}</div>`}
    function taskHtml(t){return `<div class="task ${t.completed==='true'?'done':''}"><button class="check" onclick="toggle('${t.id}')">${t.completed==='true'?'✓':''}</button><div><strong>${esc(t.title)}</strong><p>${esc(t.note||'メモなし')} ${t.dueDate?'・期限 '+esc(t.dueDate):''}</p></div></div>`}
    function meetingHtml(m){const d=new Date(m.startAt);return `<div class="meeting"><div class="date">${d.getDate()}</div><div><strong>${esc(m.title)}</strong><p>${formatDateTime(m.startAt)}〜${new Date(m.endAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}<br>${esc(m.location||'Google Calendar')}</p></div></div>`}
    function videoHtml(v){return `<div class="video"><iframe src="${esc(embed(v.url))}" allowfullscreen></iframe><strong>${esc(v.title)}</strong></div>`}
    function embed(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return'https://www.youtube.com/embed/'+u.pathname.slice(1);if(u.hostname.includes('youtube.com'))return'https://www.youtube.com/embed/'+u.searchParams.get('v');if(u.hostname.includes('vimeo.com'))return'https://player.vimeo.com/video/'+u.pathname.split('/').filter(Boolean).pop();if(u.hostname.includes('drive.google.com'))return url.replace(/\/view.*$/,'/preview')}catch(e){}return url}
    function openCompany(id=''){const c=state.companies.find(x=>x.id===id)||{name:'',industry:'',contact:'',status:'対応中',supportUnits:[]};const unitText=(c.supportUnits||[]).map(u=>u.name).join('＋'),group=(c.supportUnits||[]).find(u=>u.groupName)?.groupName||'';modal(`<div class="modal-head"><h2>${id?'企業カルテを編集':'新規企業を追加'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitCompany(event,'${id}')"><div class="form-grid"><label class="field full">企業名<input name="name" required value="${esc(c.name)}" placeholder="株式会社〇〇"></label><label class="field">業種<input name="industry" value="${esc(c.industry)}"></label><label class="field">担当者<input name="contact" value="${esc(c.contact)}"></label><label class="field">状態<select name="status">${['対応中','確認待ち','保留','完了'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">まとめ名<input name="groupName" value="${esc(group)}" placeholder="例：採用プロジェクト"></label><label class="field full">支援ユニット<input name="supportUnits" value="${esc(unitText)}" placeholder="採用支援＋営業支援"><span class="hint">「＋」で区切ると別々の支援ユニットとして保存します。まとめ名を入れると同じグループで表示します。</span></label></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">保存</button></div></form>`)}
    async function submitCompany(e,id){e.preventDefault();const f=new FormData(e.target);busy(e.submitter,true);try{state=await run('saveCompany',{id,...Object.fromEntries(f.entries()),supportUnits:String(f.get('supportUnits')||'').split(/[＋+]/)});if(!selected)selected=state.companies[0]?.id||'';closeModal();render();toast('企業カルテを保存しました')}catch(err){showError(err)}finally{busy(e.submitter,false)}}
    function openTask(){modal(`<div class="modal-head"><h2>次回やることを追加</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitTask(event)"><div class="form-grid"><label class="field full">タイトル<input name="title" required></label><label class="field">期限<input name="dueDate" type="date"></label><label class="field full">補足<textarea name="note"></textarea></label></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">追加</button></div></form>`)}
    async function submitTask(e){e.preventDefault();const f=new FormData(e.target);try{state=await run('saveTask',{companyId:selected,...Object.fromEntries(f.entries())});closeModal();render();toast('次回やることを追加しました')}catch(err){showError(err)}}async function toggle(id){try{state=await run('toggleTask',id);render()}catch(err){showError(err)}}
    function openVideo(){modal(`<div class="modal-head"><h2>動画URLを追加</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitVideo(event)"><div class="form-grid"><label class="field full">タイトル<input name="title" required></label><label class="field full">動画URL<input name="url" type="url" required></label></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">追加</button></div></form>`)}async function submitVideo(e){e.preventDefault();const f=new FormData(e.target);try{state=await run('saveVideo',{companyId:selected,...Object.fromEntries(f.entries())});closeModal();render();toast('動画を追加しました')}catch(err){showError(err)}}
    function openMerge(){const choices=state.companies.filter(c=>c.id!==selected).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');modal(`<div class="modal-head"><h2>重複企業を統合</h2><button class="close" onclick="closeModal()">×</button></div><p class="hint">現在の企業を統合元として、予定・タスク・動画・支援ユニットを統合先へ移動します。</p><form onsubmit="submitMerge(event)"><div class="form-grid"><label class="field full">統合先<select name="targetId" required><option value="">選択してください</option>${choices}</select></label></div><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary">統合する</button></div></form>`)}async function submitMerge(e){e.preventDefault();const target=new FormData(e.target).get('targetId');if(!confirm('この企業を選択した企業へ統合しますか？'))return;try{state=await run('mergeCompanies',selected,target);selected=target;closeModal();render();toast('企業を統合しました')}catch(err){showError(err)}}
    async function syncNow(){const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);toast('Googleカレンダーを同期しています…');try{const result=await run('syncCalendar');state=result.data;if(!selected&&state.companies[0])selected=state.companies[0].id;render();toast(`同期完了：予定${result.summary.synced}件・新規企業${result.summary.createdCompanies}社・支援ユニット${result.summary.createdUnits}件`)}catch(err){showError(err)}finally{buttons.forEach(b=>b.disabled=false)}}
    function modal(html){$('modalRoot').innerHTML=`<div class="modal-bg" onclick="event.target===this&&closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}function toast(message){$('toastRoot').innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>{$('toastRoot').innerHTML=''},4000)}function showError(error){if($('loading'))$('loading').innerHTML='<div><h2>読み込みに失敗しました</h2><p>'+esc(error.message||error)+'</p></div>';toast(error.message||error)}function busy(button,value){if(button)button.disabled=value}function formatDateTime(value){return new Date(value).toLocaleString('ja-JP',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}
  </script>
</body>
</html>
